<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Street Hoops</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hud">
      <div class="brand">
        <h1>Neon Street Hoops</h1>
        <p>Modern 2D physics basketball</p>
      </div>
      <div class="controls">
        <label>
          Mode
          <select id="modeSelect">
            <option value="quick">Quick Match</option>
            <option value="tournament">Tournament</option>
          </select>
        </label>
        <label>
          Team Size
          <select id="teamSize">
            <option value="1">1v1</option>
            <option value="2">2v2</option>
          </select>
        </label>
        <label>
          Difficulty
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <label>
          Character
          <select id="character"></select>
        </label>
        <button id="startBtn">Start Match</button>
      </div>
    </header>

    <main>
      <canvas id="game" width="1200" height="675"></canvas>
      <aside class="panel">
        <h2>Controls</h2>
        <ul>
          <li><strong>A/D</strong> or <strong>←/→</strong>: Move</li>
          <li><strong>W</strong> or <strong>↑</strong>: Jump / contest</li>
          <li><strong>J</strong>: Dribble burst</li>
          <li><strong>K</strong>: Shoot (hold for power, release for timing)</li>
          <li><strong>L</strong>: Steal / block attempt</li>
          <li><strong>R</strong>: Replay last score</li>
        </ul>

        <h2>Progression</h2>
        <p id="xpText"></p>
        <p id="unlocks"></p>

        <h2>Leaderboard</h2>
        <ol id="leaderboard"></ol>
      </aside>
    </main>

    <script src="game.js"></script>
  </body>
</html>
